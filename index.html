<!DOCTYPE html>
<html lang="vi" data-mode="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Stampfield">
<meta name="theme-color" content="#131517">
<title>Stampfield — Camera Đóng Dấu</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon.svg">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700&family=Barlow:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap">
<link rel="stylesheet" href="styles.css">
</head>
<body>

<!-- SVG sprite -->
<svg width="0" height="0" style="position:absolute">
  <defs>
    <symbol id="i-cam" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"><path d="M3 8.5A2.5 2.5 0 0 1 5.5 6h2L9 4h6l1.5 2h2A2.5 2.5 0 0 1 21 8.5v9A2.5 2.5 0 0 1 18.5 20h-13A2.5 2.5 0 0 1 3 17.5v-9Z"/><circle cx="12" cy="13" r="3.6"/></symbol>
    <symbol id="i-pin" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"><path d="M12 21s7-5.6 7-11a7 7 0 1 0-14 0c0 5.4 7 11 7 11Z"/><circle cx="12" cy="10" r="2.6"/></symbol>
    <symbol id="i-pin-s" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M12 21s7-5.6 7-11a7 7 0 1 0-14 0c0 5.4 7 11 7 11Z"/></symbol>
    <symbol id="i-pin-off" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M12 21s7-5.6 7-11a7 7 0 1 0-14 0c0 5.4 7 11 7 11ZM5 5l14 14"/></symbol>
    <symbol id="i-lib" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"><rect x="3" y="4" width="18" height="16" rx="2.5"/><path d="m4 16 4.5-4.5 4 4L16 12l4 4"/><circle cx="9" cy="9" r="1.4"/></symbol>
    <symbol id="i-tpl" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"><rect x="3" y="4" width="18" height="16" rx="2.5"/><path d="M6 15h7M6 18h4"/></symbol>
    <symbol id="i-flash" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M13 2 4.5 13H11l-1 9 8.5-11H12l1-9Z"/></symbol>
    <symbol id="i-flip" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"><path d="M4 9V7a2 2 0 0 1 2-2h9l-2.5-2.5M20 15v2a2 2 0 0 1-2 2H9l2.5 2.5"/></symbol>
    <symbol id="i-chev-d" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="m6 9 6 6 6-6"/></symbol>
    <symbol id="i-chev-r" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="m9 6 6 6-6 6"/></symbol>
    <symbol id="i-chev-l" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="m14 6-6 6 6 6"/></symbol>
    <symbol id="i-x" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><path d="M6 6l12 12M18 6 6 18"/></symbol>
    <symbol id="i-plus" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></symbol>
    <symbol id="i-retake" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"><path d="M3 12a9 9 0 1 0 3-6.7M3 4v5h5"/></symbol>
    <symbol id="i-share" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"><path d="M12 16V3m0 0L7.5 7.5M12 3l4.5 4.5M4 15v4a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2v-4"/></symbol>
    <symbol id="i-check" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="m4 12.5 5 5L20 6.5"/></symbol>
    <symbol id="i-pdf" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"><path d="M6 3h8l4 4v14H6z"/><path d="M9 13h6M9 17h4"/></symbol>
    <symbol id="i-zip" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"><path d="M4 6a2 2 0 0 1 2-2h5l2 2h5a2 2 0 0 1 2 2v10a2 2 0 0 1-2 2H6a2 2 0 0 1-2-2z"/><path d="M11 9h2M11 12h2M11 15h2"/></symbol>
    <symbol id="i-trash" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"><path d="M4 7h16M9 7V4h6v3M6 7l1 13h10l1-13"/></symbol>
    <symbol id="i-warn" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><path d="M12 8v5M12 16.5v.5"/><circle cx="12" cy="12" r="9"/></symbol>
    <symbol id="i-gear" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.8l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-1.8-.3 1.7 1.7 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.1a1.7 1.7 0 0 0-1.1-1.5 1.7 1.7 0 0 0-1.8.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.7 1.7 0 0 0 .3-1.8 1.7 1.7 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.1a1.7 1.7 0 0 0 1.5-1.1 1.7 1.7 0 0 0-.3-1.8l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.7 1.7 0 0 0 1.8.3H9a1.7 1.7 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.1a1.7 1.7 0 0 0 1 1.5 1.7 1.7 0 0 0 1.8-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0-.3 1.8V9a1.7 1.7 0 0 0 1.5 1H21a2 2 0 1 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1Z"/></symbol>
  </defs>
</svg>

<div id="app">
  <!-- status bar (desktop frame only) -->
  <div id="statusbar">
    <span class="time" id="sb-time">14:32</span>
    <span class="icons">
      <svg width="18" height="12" viewBox="0 0 18 12" fill="currentColor"><rect x="0" y="8" width="3" height="4" rx="1"/><rect x="5" y="5.5" width="3" height="6.5" rx="1"/><rect x="10" y="3" width="3" height="9" rx="1"/><rect x="15" y="0" width="3" height="12" rx="1" opacity=".35"/></svg>
      <svg width="16" height="12" viewBox="0 0 16 12" fill="none" stroke="currentColor" stroke-width="1.6"><path d="M1 4.2a10 10 0 0 1 14 0M3.6 7a6.4 6.4 0 0 1 8.8 0"/><circle cx="8" cy="10.2" r="1.1" fill="currentColor" stroke="none"/></svg>
      <svg width="27" height="13" viewBox="0 0 27 13" fill="none"><rect x="1" y="1" width="22" height="11" rx="3.2" stroke="currentColor" stroke-opacity=".45"/><rect x="2.8" y="2.8" width="15" height="7.4" rx="2" fill="currentColor"/><path d="M25 5v3a2.6 2.6 0 0 0 0-3z" fill="currentColor" fill-opacity=".5"/></svg>
    </span>
  </div>

  <!-- 1 · ONBOARDING -->
  <section class="screen" id="s-onboard">
    <div class="ob-brand">
      <div class="mark"><svg width="19" height="19" style="color:#fff"><use href="#i-cam"/></svg></div>
      <div class="name">Stampfield</div>
    </div>
    <div class="ob-title" data-t="obTitle"></div>
    <div class="ob-sub" data-t="obSub"></div>
    <div class="perm">
      <svg width="22" height="22"><use href="#i-cam"/></svg>
      <div style="flex:1"><div class="t" data-t="permCamT"></div><div class="d" data-t="permCamD"></div></div>
      <div class="state pill line" id="perm-cam" data-t="pending"></div>
    </div>
    <div class="perm">
      <svg width="22" height="22"><use href="#i-pin"/></svg>
      <div style="flex:1">
        <div class="t" data-t="permLocT"></div><div class="d" data-t="permLocD"></div>
        <div class="opts"><button class="on" data-t="locAlways"></button><button data-t="locWhile"></button></div>
      </div>
      <div class="state pill line" id="perm-loc" data-t="pending"></div>
    </div>
    <div class="perm">
      <svg width="22" height="22"><use href="#i-lib"/></svg>
      <div style="flex:1"><div class="t" data-t="permLibT"></div><div class="d" data-t="permLibD"></div></div>
      <div class="state pill line" data-t="optional"></div>
    </div>
    <div style="flex:1"></div>
    <button class="btn-primary" id="ob-cta" data-t="obCta"></button>
    <div class="ob-foot" data-t="obFoot"></div>
  </section>

  <!-- 2 · CAMERA -->
  <section class="screen" id="s-camera">
    <div id="viewfinder">
      <video id="video" autoplay playsinline muted></video>
      <div id="vf-placeholder">live camera preview</div>
      <div id="dropzones">
        <i class="tl"></i><i class="tr"></i><i class="bl"></i><i class="br"></i><i class="bc"></i>
      </div>
      <div class="wm" id="wm"><div class="wm-plate">
        <div class="body">
          <div class="l-time"></div><div class="l-coord"></div><div class="l-alt"></div><div class="l-addr"></div><div class="l-proj"></div>
        </div>
        <div class="side"><div class="logo">LOGO</div><div class="qr"></div></div>
      </div></div>
      <div id="flash-fx"></div>
    </div>
    <div id="cam-top">
      <button class="glass" id="proj-chip"><span class="dot"></span><span class="name">—</span><svg width="13" height="13" style="color:rgba(255,255,255,.6);flex:none"><use href="#i-chev-d"/></svg></button>
      <div style="flex:1"></div>
      <button class="glass cam-btn" id="btn-editor" title="Template"><svg width="19" height="19"><use href="#i-tpl"/></svg></button>
      <button class="glass cam-btn" id="btn-flash" title="Flash"><svg width="19" height="19"><use href="#i-flash"/></svg></button>
      <button class="glass" id="ratio-btn">4:3</button>
    </div>
    <div class="glass" id="gps-chip"><svg width="13" height="13"><use href="#i-pin-s"/></svg><span id="gps-text">GPS —</span></div>
    <div id="rec-timer" class="hidden">00:00</div>
    <div id="cam-banner"></div>
    <div id="cam-bottom">
      <div id="modes">
        <button data-mode="video" data-t="modeVideo"></button>
        <button data-mode="photo" class="on" data-t="modePhoto"></button>
        <button data-mode="burst" data-t="modeBurst"></button>
      </div>
      <div id="cam-controls">
        <button id="thumb"><span class="ts"></span></button>
        <button id="shutter"><i></i></button>
        <button class="glass" id="flip"><svg width="23" height="23"><use href="#i-flip"/></svg></button>
      </div>
    </div>
  </section>

  <!-- 3 · TEMPLATE EDITOR -->
  <section class="screen" id="s-editor">
    <div class="nav-head">
      <button class="back" data-nav="camera"><svg width="18" height="18"><use href="#i-chev-l"/></svg><span data-t="back"></span></button>
      <div class="nav-title" data-t="edTitle"></div>
      <button class="link" id="ed-save" data-t="save"></button>
    </div>
    <div class="scroll">
      <div id="tpl-preview">
        <span class="lbl">live preview</span>
        <div class="wm"><div class="wm-plate sm">
          <div class="body"><div class="l-time"></div><div class="l-coord"></div><div class="l-alt"></div><div class="l-addr"></div><div class="l-proj"></div></div>
          <div class="side"><div class="logo">LOGO</div><div class="qr"></div></div>
        </div></div>
      </div>
      <div id="tpl-list"></div>
      <div class="section-label" data-t="fields"></div>
      <div class="list" id="field-list">
        <div class="row"><span class="grow" data-t="fDate"></span><span class="val" id="ed-datefmt">dd/MM/yyyy HH:mm:ss</span><button class="toggle" data-field="date"></button></div>
        <div class="row"><span class="grow" data-t="fCoord"></span>
          <div class="mini-seg"><button data-coord="dms">DMS</button><button data-coord="dec">DEC</button></div>
          <button class="toggle" data-field="coord"></button></div>
        <div class="row"><span class="grow" data-t="fAddr"></span><button class="toggle" data-field="addr"></button></div>
        <div class="row"><span class="grow" data-t="fProject"></span><button class="toggle" data-field="project"></button></div>
        <div class="row"><span class="grow" data-t="fAlt"></span><button class="toggle" data-field="alt"></button></div>
        <div class="row"><span class="grow" data-t="fWeather"></span><button class="toggle" data-field="weather"></button></div>
        <div class="row"><span class="grow" data-t="fLogo"></span><button class="toggle" data-field="logo"></button></div>
        <div class="row"><span class="grow" data-t="fQr"></span><button class="toggle" data-field="qr"></button></div>
      </div>
      <div class="section-label" data-t="appearance"></div>
      <div class="list">
        <div class="row"><span class="grow" data-t="aSize"></span><input type="range" class="range" id="ed-scale" min="0.8" max="1.3" step="0.05" style="width:130px"></div>
        <div class="row"><span class="grow" data-t="aOpacity"></span><input type="range" class="range" id="ed-opacity" min="0.3" max="0.9" step="0.05" style="width:130px"></div>
        <div class="row"><span class="grow" data-t="aColor"></span>
          <div class="swatches" id="ed-colors">
            <button data-color="#ffffff" style="background:#fff"></button>
            <button data-color="#b5d9fd" style="background:#b5d9fd"></button>
            <button data-color="#f0dcb8" style="background:#f0dcb8"></button>
            <button data-color="#8fd0a4" style="background:#8fd0a4"></button>
          </div></div>
        <div class="row"><span class="grow" data-t="aPos"></span>
          <div class="anchor-grid" id="ed-anchor">
            <button data-pos="tl">TL</button><span></span><button data-pos="tr">TR</button>
            <button data-pos="bl">BL</button><button data-pos="bc">BC</button><button data-pos="br">BR</button>
          </div></div>
        <div class="row"><span class="grow" data-t="aLogo"></span><label class="link" for="ed-logo" style="cursor:pointer" data-t="pick"></label><input type="file" id="ed-logo" accept="image/*" class="hidden"></div>
      </div>
      <div style="height:20px"></div>
    </div>
  </section>

  <!-- 4 · PREVIEW & SAVE -->
  <section class="screen" id="s-preview">
    <div id="pv-image">
      <img id="pv-img" alt="">
      <div class="topbar">
        <button class="pv-x" id="pv-close" style="color:#fff"><svg width="19" height="19"><use href="#i-x"/></svg></button>
        <span class="pv-tag" id="pv-tag">IMG · —</span>
      </div>
    </div>
    <div class="scroll">
      <div class="card pad">
        <div class="kv"><span data-t="mProject"></span><b id="pv-proj">—</b></div>
        <div class="kv-sep"></div>
        <div class="kv"><span data-t="mCoord"></span><span class="mono" id="pv-coord">—</span></div>
        <div class="kv-sep"></div>
        <div class="kv"><span data-t="mAcc"></span><span class="mono" id="pv-acc">—</span></div>
      </div>
      <div class="card pad">
        <div class="section-label" style="margin-bottom:5px" data-t="note"></div>
        <textarea class="textfield" id="pv-note" rows="2" data-ph="notePh"></textarea>
      </div>
    </div>
    <div class="foot">
      <button class="btn-ghost btn-icon" id="pv-retake" title="Retake"><svg width="21" height="21"><use href="#i-retake"/></svg></button>
      <button class="btn-ghost btn-icon" id="pv-share" title="Share"><svg width="21" height="21"><use href="#i-share"/></svg></button>
      <button class="btn-primary" id="pv-save" style="flex:1"><svg width="19" height="19"><use href="#i-check"/></svg><span data-t="saveTo"></span></button>
    </div>
  </section>

  <!-- 5 · LIBRARY -->
  <section class="screen" id="s-library">
    <div class="screen-head" id="lib-head">
      <div class="top">
        <div class="title" data-t="libTitle"></div>
        <div class="actions">
          <button class="link" id="lib-select" data-t="select"></button>
          <button class="cam-go" data-nav="camera"><svg width="18" height="18" style="color:#fff"><use href="#i-cam"/></svg></button>
        </div>
      </div>
      <div class="seg" id="lib-tabs">
        <button data-tab="project" class="on" data-t="tabProject"></button>
        <button data-tab="date" data-t="tabDate"></button>
        <button data-tab="map" data-t="tabMap"></button>
      </div>
    </div>
    <div class="scroll" id="lib-body"></div>
    <div id="lib-bar">
      <span class="picked" id="lib-picked"></span>
      <button class="bar-btn danger" id="lib-del"><svg width="16" height="16"><use href="#i-trash"/></svg></button>
      <button class="bar-btn" id="lib-pdf"><svg width="16" height="16"><use href="#i-pdf"/></svg>PDF</button>
      <button class="bar-btn fill" id="lib-zip"><svg width="16" height="16"><use href="#i-zip"/></svg>ZIP</button>
    </div>
  </section>

  <!-- 6 · PHOTO DETAIL -->
  <section class="screen" id="s-detail">
    <div id="dt-image">
      <img id="dt-img" alt="">
      <button class="pv-x back" id="dt-back" style="color:#fff"><svg width="19" height="19"><use href="#i-chev-l"/></svg></button>
    </div>
    <div class="scroll">
      <div class="dt-top">
        <div class="minimap"><canvas id="dt-map" width="192" height="192"></canvas></div>
        <div style="flex:1;min-width:0">
          <div class="h" id="dt-title">—</div>
          <div class="a" id="dt-addr">—</div>
          <span class="pill tint" id="dt-gps">GPS</span>
        </div>
      </div>
      <div class="list">
        <div class="kv small"><span data-t="mTime"></span><span class="mono" id="dt-time"></span></div>
        <div class="kv small"><span data-t="mCoord"></span><span class="mono" id="dt-coord"></span></div>
        <div class="kv small"><span data-t="mAlt"></span><span class="mono" id="dt-alt"></span></div>
        <div class="kv small"><span data-t="mAuthor"></span><b id="dt-author"></b></div>
        <div class="kv small"><span data-t="note"></span><span id="dt-note"></span></div>
        <div class="kv small"><span data-t="mFile"></span><span class="mono" id="dt-file"></span></div>
      </div>
    </div>
    <div class="foot">
      <button class="btn-ghost" id="dt-share" style="flex:1;height:48px;border-radius:13px"><svg width="18" height="18"><use href="#i-share"/></svg><span data-t="share"></span></button>
      <button class="btn-primary" id="dt-pdf" style="flex:1;height:48px;border-radius:13px;font-size:15px"><svg width="18" height="18"><use href="#i-pdf"/></svg><span data-t="export"></span></button>
      <button class="btn-ghost" id="dt-del" style="flex:none;width:48px;height:48px;border-radius:13px;color:var(--err)"><svg width="18" height="18"><use href="#i-trash"/></svg></button>
    </div>
  </section>

  <!-- 7 · PROJECTS -->
  <section class="screen" id="s-projects">
    <div class="screen-head">
      <div class="title" data-t="prTitle"></div>
      <div style="display:flex;gap:16px;align-items:center">
        <button class="link" id="pr-settings" title="Settings"><svg width="22" height="22"><use href="#i-gear"/></svg></button>
        <button class="link" data-nav="camera" data-t="done"></button>
      </div>
    </div>
    <div class="scroll" id="pr-list"></div>
  </section>

  <!-- 8 · SETTINGS -->
  <section class="screen" id="s-settings">
    <div class="screen-head">
      <div class="title" data-t="stTitle"></div>
      <button class="link" data-nav="camera" data-t="done"></button>
    </div>
    <div class="scroll">
      <div class="section-label" data-t="grpFormat"></div>
      <div class="list">
        <button class="row" id="st-date"><span class="grow" data-t="sDate"></span><span class="val" id="st-date-v"></span><svg class="chev" width="14" height="14"><use href="#i-chev-r"/></svg></button>
        <button class="row" id="st-coord"><span class="grow" data-t="sCoord"></span><span class="val" id="st-coord-v"></span><svg class="chev" width="14" height="14"><use href="#i-chev-r"/></svg></button>
        <button class="row" id="st-quality"><span class="grow" data-t="sQuality"></span><span class="val" id="st-quality-v"></span><svg class="chev" width="14" height="14"><use href="#i-chev-r"/></svg></button>
      </div>
      <div class="section-label" data-t="grpStorage"></div>
      <div class="list">
        <div class="row"><span class="grow" data-t="sAutoSave"><br></span><button class="toggle" id="st-autosave"></button></div>
        <div class="row"><span class="grow"><span data-t="sCloud"></span><div class="sub" id="st-storage-sub">—</div></span><button class="toggle" id="st-cloud"></button></div>
        <button class="row" id="st-author"><span class="grow" data-t="sAuthor"></span><span class="val" id="st-author-v"></span><svg class="chev" width="14" height="14"><use href="#i-chev-r"/></svg></button>
      </div>
      <div class="section-label" data-t="grpAppearance"></div>
      <div class="list" id="st-mode">
        <button class="row" data-mode="system"><span class="grow" data-t="mSystem"></span><span class="ck">✓</span></button>
        <button class="row" data-mode="light"><span class="grow">Light</span><span class="ck">✓</span></button>
        <button class="row" data-mode="dark"><span class="grow">Dark</span><span class="ck">✓</span></button>
      </div>
      <div class="section-label" data-t="grpLang"></div>
      <div class="list" id="st-lang">
        <button class="row" data-lang="vi"><span class="grow">Tiếng Việt</span><span class="ck">✓</span></button>
        <button class="row" data-lang="en"><span class="grow">English</span><span class="ck">✓</span></button>
      </div>
      <div class="section-label" data-t="grpAbout"></div>
      <div class="list">
        <div class="row"><span class="grow">Stampfield</span><span class="val">v1.0 · PWA</span></div>
        <button class="row" id="st-reset"><span class="grow" style="color:var(--err)" data-t="sReset"></span></button>
      </div>
      <div style="height:24px"></div>
    </div>
  </section>

  <!-- sheet / toast / busy -->
  <div id="sheet-veil"><div id="sheet"></div></div>
  <div id="toast"><svg width="15" height="15"><use href="#i-check"/></svg><span id="toast-text"></span></div>
  <div id="busy"><div class="box"><span class="spin"></span><span id="busy-text"></span></div></div>
</div>

<!-- desktop side panel — mirrors the prototype controls of the design doc -->
<div id="desk-panel">
  <div>
    <div class="h" data-t="dpScreens"></div>
    <div class="wrap" id="dp-screens">
      <button data-nav="onboard">1 · <span data-t="dpOnboard"></span></button>
      <button data-nav="camera">2 · Camera</button>
      <button data-nav="editor">3 · <span data-t="dpEditor"></span></button>
      <button data-nav="preview">4 · <span data-t="dpPreview"></span></button>
      <button data-nav="library">5 · <span data-t="dpLibrary"></span></button>
      <button data-nav="detail">6 · <span data-t="dpDetail"></span></button>
      <button data-nav="projects">7 · <span data-t="dpProjects"></span></button>
      <button data-nav="settings">8 · <span data-t="dpSettings"></span></button>
    </div>
  </div>
  <div>
    <div class="h" data-t="dpModeLang"></div>
    <div class="wrap" style="margin-bottom:6px"><button data-setmode="light">Light</button><button data-setmode="dark">Dark</button></div>
    <div class="wrap"><button data-setlang="vi">Việt</button><button data-setlang="en">English</button></div>
  </div>
  <div>
    <div class="h" data-t="dpWm"></div>
    <div class="mono" id="dp-anchor">neo hiện tại: bl</div>
    <div class="wrap" style="display:grid;grid-template-columns:1fr 1fr 1fr">
      <button data-setpos="tl">TL</button><span></span><button data-setpos="tr">TR</button>
      <button data-setpos="bl">BL</button><button data-setpos="bc">BC</button><button data-setpos="br">BR</button>
    </div>
    <div class="note" data-t="dpWmNote"></div>
  </div>
</div>

<canvas id="work" class="hidden"></canvas>
<script src="app.js"></script>
</body>
</html>
